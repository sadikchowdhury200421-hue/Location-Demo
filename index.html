<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Permission</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>📍 Location Sharing</h2>

  <p>
    To continue, please allow this website to access
    your current location.
  </p>

  <button onclick="shareLocation()">
    Allow & Share Location
  </button>

  <div id="status"></div>
</div>

<script>
function shareLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerText = "Location is not supported.";
    return;
  }

  status.innerText = "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      try {

        const response = await fetch("/api/location", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          status.innerText =
            "✅ Your location has been shared.";
        } else {
          status.innerText =
            "❌ Could not share location.";
        }

      } catch (error) {
        status.innerText =
          "❌ Server connection failed.";
      }
    },

    function(error) {

      if (error.code === 1) {
        status.innerText =
          "❌ Location permission was denied.";
      } else {
        status.innerText =
          "❌ Could not get your location.";
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
